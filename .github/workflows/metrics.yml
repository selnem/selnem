name: Metrics

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN(개인 토큰) 시크릿이 있으면 사용하고,
          # 없으면 기본 토큰으로 동작한다. 기본 토큰은 저장소/언어/조직
          # 정보를 읽지 못해 해당 섹션이 0으로 나올 수 있다.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: selnem
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          # 조직 저장소까지 포함해 본인이 작성한 커밋 기준으로 언어를 집계
          repositories_affiliations: owner, collaborator, organization_member
          repositories: 200
          # 커밋 작성자 이름이 selnem / CODA / 전성환으로 섞여 있어
          # 공통 이메일로 본인 커밋을 식별한다
          commits_authoring: selnem, tjdghks0130@naver.com
          plugin_languages: yes
          plugin_languages_limit: 8
          # 언어별 매핑이 미적용되어 순위 순서 팔레트로 색 지정
          # (Java, Python, Kotlin, JS, PLpgSQL, CSS, Shell, Dockerfile 순)
          plugin_languages_colors: "#b07219, #3572A5, #A97BFF, #f1e05a, #336790, #663399, #89e051, #384d54"
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          # 자동 수집에서 누락되는 저장소를 명시적으로 분석 대상에 추가
          plugin_languages_indepth_custom: kau-likelion-13th/CODA-Frontend
          # 수업 과제·학습용 저장소는 언어 통계에서 제외 (C 비중 왜곡 방지)
          plugin_languages_skipped: >-
            OSlecture, osAssignment, st7789, pngToc,
            codetree-TILs, curly-disco, CODA_algorithm
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
