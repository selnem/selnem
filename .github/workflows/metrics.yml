name: Metrics

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN(개인 토큰) 시크릿이 있으면 사용하고,
          # 없으면 기본 토큰으로 동작한다. 기본 토큰은 저장소/언어/조직
          # 정보를 읽지 못해 해당 섹션이 0으로 나올 수 있다.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: selnem
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_details: percentage
          # 수업 과제·학습용 저장소는 언어 통계에서 제외 (C 비중 왜곡 방지)
          plugin_languages_skipped: >-
            OSlecture, osAssignment, st7789, pngToc,
            codetree-TILs, curly-disco, CODA_algorithm
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
