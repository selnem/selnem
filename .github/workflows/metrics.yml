name: Metrics

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: selnem
          template: classic
          # 기본 GITHUB_TOKEN으로는 저장소/언어/조직 정보가 조회되지 않아
          # 정확하게 나오는 섹션만 표시한다.
          base: header, activity
          config_timezone: Asia/Seoul
